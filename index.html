<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>$Joana Indiana$$</title>
	<style>
		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
			overflow: hidden;
		}

		#canvas {
			display: block;
			width: 100vw;
			height: 100vh;
		}

		/* Status display */
		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			pointer-events: none;
		}

		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444146;
			padding: 1px;
			border-radius: 3px;
			display: none;
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			background-color: #E2B438;
			border-radius: 2px;
			transition: width 0.1s linear;
		}

		#status-indeterminate {
			display: none;
			color: #E2B438;
			font-family: sans-serif;
			font-size: 14px;
		}

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			display: none;
			padding: 10px;
			background: #3a1a1a;
			border: 1px solid #7a2a2a;
			color: #ff9999;
			font-family: sans-serif;
			font-size: 14px;
			pointer-events: auto;
		}
	</style>
	$<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
$$
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>
	<div id="status">
		<div id="status-progress" oncontextmenu="event.preventDefault();"><div id="status-progress-inner"></div></div>
		<div id="status-indeterminate" oncontextmenu="event.preventDefault();">Loading game...</div>
		<div id="status-notice"></div>
	</div>

	<!-- Poki SDK -->
	<script src="https://game-distribution.poki.sdk/v2/poki-sdk.js"></script>

	<!-- CrazyGames SDK -->
	<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

	<script>
		// Initialize Poki SDK if we are running in the Poki frame
		if (typeof PokiSDK !== 'undefined') {
			PokiSDK.init().then(() => {
				console.log("Poki SDK initialized successfully");
			}).catch(() => {
				console.log("Poki SDK failed to initialize (likely blocked by AdBlocker)");
			});
		}

		// Initialize CrazyGames SDK if we are running on CrazyGames
		window.addEventListener('load', () => {
			if (window.crazygames && window.crazygames.SDK) {
				console.log("CrazyGames SDK loaded and ready");
			}
		});
	</script>

	<script src="$index.js$$"></script>
	<script>
		const GODOT_CONFIG = ${"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":58731712,"index.wasm":35749181},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4}$$;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusProgress = document.getElementById('status-progress');
			const statusProgressInner = document.getElementById('status-progress-inner');
			const statusIndeterminate = document.getElementById('status-indeterminate');
			const statusNotice = document.getElementById('status-notice');

			let initializing = true;
			let statusMode = 'none';

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) {
					return;
				}
				[statusProgress, statusIndeterminate, statusNotice].forEach((elem) => {
					elem.style.display = 'none';
				});
				if (mode === 'progress') {
					statusProgress.style.display = 'block';
				} else if (mode === 'indeterminate') {
					statusIndeterminate.style.display = 'block';
				} else if (mode === 'notice') {
					statusNotice.style.display = 'block';
				}
				statusMode = mode;
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				const lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			}

			function displayFailureNotice(err) {
				const msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			}

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');
				engine.startGame({
					'onProgress': function (current, total) {
						if (total > 0) {
							statusProgressInner.style.width = `${(current / total) * 100}%`;
							setStatusMode('progress');
							if (current === total) {
								setTimeout(() => {
									setStatusMode('none');
								}, 100);
							}
						} else {
							setStatusMode('indeterminate');
						}
					},
				}).then(() => {
					initializing = false;
				}).catch(displayFailureNotice);
			}
		}());
	</script>
</body>
</html>
