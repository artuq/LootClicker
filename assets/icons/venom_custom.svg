  <!-- Butelka (szkło) -->
  <rect x="150" y="80" width="212" height="300" fill="#1a4d1a" opacity="0.3" rx="10"/>
  <rect x="155" y="85" width="202" height="290" fill="#22aa22" opacity="0.6" rx="10"/>
  
  <!-- Zielona trucizna wewnątrz -->
