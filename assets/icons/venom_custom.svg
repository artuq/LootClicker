  <path d="M 161 300 Q 161 330 256 340 Q 351 330 351 300" fill="#00ff00" opacity="0.8"/>
  
  <!-- Korka/czop -->
  <rect x="230" y="50" width="52" height="35" fill="#8b4513" rx="5"/>
  <ellipse cx="256" cy="50" rx="30" ry="12" fill="#a0522d"/>
  
  <!-- Blask trucizny -->
