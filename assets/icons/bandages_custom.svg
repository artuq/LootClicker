<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Bandages - szara tkanina z krzyżami -->
  <rect width="512" height="512" fill="#2a2a2a"/>
  
  <!-- Główny bandaż -->
  <rect x="100" y="150" width="312" height="212" fill="#888888" rx="20"/>
  
  <!-- Zmarszczki -->
  <line x1="120" y1="180" x2="392" y2="185" stroke="#666666" stroke-width="8"/>
  <line x1="130" y1="220" x2="382" y2="215" stroke="#666666" stroke-width="8"/>
  <line x1="125" y1="260" x2="387" y2="265" stroke="#666666" stroke-width="8"/>
  <line x1="135" y1="300" x2="377" y2="295" stroke="#666666" stroke-width="8"/>
  <line x1="128" y1="340" x2="384" y2="345" stroke="#666666" stroke-width="8"/>
  
  <!-- Białe krzyże (medyczne) -->
  <rect x="180" y="220" width="40" height="80" fill="#ffffff" opacity="0.8"/>
  <rect x="160" y="240" width="80" height="40" fill="#ffffff" opacity="0.8"/>
  
  <rect x="292" y="220" width="40" height="80" fill="#ffffff" opacity="0.8"/>
  <rect x="272" y="240" width="80" height="40" fill="#ffffff" opacity="0.8"/>
</svg>